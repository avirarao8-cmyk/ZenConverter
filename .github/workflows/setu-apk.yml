name: Format Setu APK

# Builds a signed, installable Format Setu APK on GitHub's runners, where there is
# no per-command time limit. Triggered manually from the Actions tab or the API.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  ICON_URL: https://github.com/avirarao8-cmyk/ZenConverter/releases/download/setu-ci/setu-icon-source.png
  ICON_SHA256: 1bc577a8b71aaa2cf68ffdd7f20793e8b79fb011499f0ad2a6a287ebb80df448

jobs:
  build:
    name: Build signed arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Apply Format Setu changes
        run: |
          set -euo pipefail
          git apply --verbose formatsetu.patch
          grep -n 'name="app_name"' app/src/main/res/values/strings.xml
          grep -c 'zenConverterTypography' app/src/main/java/org/zenconverter/app/ui/ZenConverterApp.kt

      - name: Fetch icon artwork
        run: |
          set -euo pipefail
          curl -sSL -o setu-icon-source.png "${ICON_URL}"
          echo "${ICON_SHA256}  setu-icon-source.png" | sha256sum -c -
          ls -lh setu-icon-source.png

      - name: Generate app icon
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 tools/setu_icon.py setu-icon-source.png

      - name: Generate signing keystore
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore setu-ci.jks \
            -alias setu \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass setuci -keypass setuci \
            -dname "CN=Format Setu, OU=CI, O=Format Setu, C=IN"

      - name: Configure local.properties
        run: |
          set -euo pipefail
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT}"
            echo "ZENCONVERTER_VERSION_NAME=1.4.0"
            echo "ZENCONVERTER_VERSION_CODE=1004000"
            echo "RELEASE_STORE_FILE=setu-ci.jks"
            echo "RELEASE_STORE_PASSWORD=setuci"
            echo "RELEASE_KEY_ALIAS=setu"
            echo "RELEASE_KEY_PASSWORD=setuci"
          } > local.properties
          cat local.properties

      - name: Allow Gradle wrapper execution
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace clean assembleRelease

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "${apk}"
          cp "${apk}" dist/Format-Setu-1.4.0-arm64-v8a.apk
          sha256sum dist/Format-Setu-1.4.0-arm64-v8a.apk
          ls -lh dist

      - name: Publish APK to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view setu-ci >/dev/null 2>&1 || \
            gh release create setu-ci \
              --title "Format Setu CI build" \
              --notes "Automated build of Format Setu."
          gh release upload setu-ci dist/Format-Setu-1.4.0-arm64-v8a.apk --clobber

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: formatsetu-apk
          path: dist/Format-Setu-1.4.0-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
